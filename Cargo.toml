[package]
name = "d1-preflight"
version = "0.1.0"
edition = "2024"
description = "Offline, evidence-based migration safety analysis for Cloudflare D1"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.41.1", features = ["bundled", "backup", "hooks", "limits"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
tempfile = "3"
glob = "0.3"
sqlparser = "0.59"
